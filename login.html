<!DOCTYPE html>
<!-- login.html — halaman login tiruan -->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sistem Akademik SMA Pencawan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-bg">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-box">SP</div>
        <div>
          <h1>SMA Pencawan</h1>
          <p>Sistem Akademik Digital — Prototype</p>
        </div>
      </div>

      <div class="login-err" id="login-err">
        <i class="fa-solid fa-circle-exclamation"></i> Nama pengguna atau kata sandi salah.
      </div>

      <form id="form-login" autocomplete="off">
        <div class="form-group">
          <label class="form-label">Nama Pengguna</label>
          <input class="form-input" id="user" placeholder="mis. admin" required>
        </div>
        <div class="form-group">
          <label class="form-label">Kata Sandi</label>
          <input class="form-input" id="pass" type="password" placeholder="••••••••" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit" style="margin-top:6px">
          <i class="fa-solid fa-right-to-bracket"></i> Masuk
        </button>
      </form>

      <div class="demo-box">
        <strong><i class="fa-solid fa-key"></i> Akun Demo</strong><br>
        Admin: <code>admin</code> / <code>admin123</code><br>
        Guru: <code>guru</code> / <code>guru123</code>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Login tiruan: cocokkan kredensial dari data dummy
    $("#form-login").addEventListener("submit", e => {
      e.preventDefault();
      const u = $("#user").value.trim();
      const p = $("#pass").value;
      const akun = AKUN.find(a => a.user === u && a.pass === p);
      if (!akun) {
        $("#login-err").style.display = "block";
        return;
      }
      Auth.login({ user: akun.user, role: akun.role, nama: akun.nama, foto: akun.foto, guruId: akun.guruId || null });
      window.location.href = akun.role === "admin" ? "admin/dashboard.html" : "guru/dashboard.html";
    });
  </script>
</body>
</html>
